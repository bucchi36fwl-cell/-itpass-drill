<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITパスポート演習帳</title>
<meta name="description" content="ITパスポート試験の3分野（ストラテジ・マネジメント・テクノロジ）の要点まとめと四肢択一の演習問題。分野別・ランダム・ミニ模試・復習モードつき。">
<meta property="og:title" content="ITパスポート演習帳">
<meta property="og:description" content="ITパスポート試験の要点まとめと演習問題。スマホでも使えます。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F6E62'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E%E3%82%A2%3C/text%3E%3C/svg%3E">
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#18221F; --muted:#5B6A65; --line:#D7DDD9;
  --accent:#0F6E62; --accent-ink:#FFFFFF; --accent-soft:#DCEEEA;
  --st:#A85A1B; --st-soft:#F6E7DA;
  --ma:#3A55A0; --ma-soft:#E1E7F6;
  --te:#0F6E62; --te-soft:#DCEEEA;
  --ok:#237A47; --ok-soft:#DDF1E3; --ng:#B3362B; --ng-soft:#F8E0DD;
  --shadow:0 1px 2px rgba(24,34,31,.06),0 4px 16px rgba(24,34,31,.05);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-head:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111816; --panel:#19221F; --ink:#E6ECE9; --muted:#9AA9A4; --line:#2C3833;
    --accent:#3FB8A6; --accent-ink:#0B1412; --accent-soft:#1C3531;
    --st:#E09A5E; --st-soft:#3A2A1C; --ma:#8EA6EA; --ma-soft:#222B45; --te:#3FB8A6; --te-soft:#1C3531;
    --ok:#5FCB8A; --ok-soft:#183324; --ng:#F07B6F; --ng-soft:#3D1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111816; --panel:#19221F; --ink:#E6ECE9; --muted:#9AA9A4; --line:#2C3833;
  --accent:#3FB8A6; --accent-ink:#0B1412; --accent-soft:#1C3531;
  --st:#E09A5E; --st-soft:#3A2A1C; --ma:#8EA6EA; --ma-soft:#222B45; --te:#3FB8A6; --te-soft:#1C3531;
  --ok:#5FCB8A; --ok-soft:#183324; --ng:#F07B6F; --ng-soft:#3D1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:26px;font-weight:900;letter-spacing:.02em}
h2{font-size:18px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
header.top .sub{font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:var(--panel);padding:10px 16px;border-radius:6px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--shadow)}

/* summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.gauge{width:108px;height:108px}
.fields{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:7.5em 1fr 4.2em;gap:10px;align-items:center;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.bar .pass{position:absolute;top:-3px;bottom:-3px;left:60%;width:2px;background:var(--ink);opacity:.5}
.frow .v{text-align:right}
.note{font-size:12px;color:var(--muted)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--ink)}
.mode strong{font-family:var(--f-head);font-size:16px}
.mode span{font-size:13px;color:var(--muted);line-height:1.6}
.mode .tag{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.06em}
.tag.st{background:var(--st-soft);color:var(--st)} .tag.ma{background:var(--ma-soft);color:var(--ma)} .tag.te{background:var(--te-soft);color:var(--te)}
.tag.all{background:var(--ink);color:var(--bg)} .tag.rv{background:var(--ng-soft);color:var(--ng)}

.info dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:12px 0 0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:17px;line-height:1.85;margin:0;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice{display:grid;grid-template-columns:2.2em 1fr;gap:10px;align-items:start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.65}
.choice:not(:disabled):hover{border-color:var(--ink)}
.choice .k{font-family:var(--f-head);font-weight:900;width:1.9em;height:1.9em;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:14px}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice.ng .k{background:var(--ng);border-color:var(--ng);color:var(--panel)}
.choice:disabled{cursor:default}
.explain{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.verdict{font-family:var(--f-head);font-weight:900;font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.explain p{margin:0}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.timer{font-size:14px}

/* result */
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score .big{font-family:var(--f-mono);font-size:48px;font-weight:700;line-height:1}
.wrong-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.wrong-list .w{border-left:3px solid var(--ng);padding:4px 0 4px 12px;font-size:14px}
.wrong-list .w b{display:block}
/* notes */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc)}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;background:var(--panel)}
.toc a:hover{border-color:var(--ink)}
.nsec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.nsec h3{font-size:17px;display:flex;align-items:baseline;gap:10px}
.nsec h3 .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nsec p.lead{margin:0;color:var(--muted);font-size:14px}
.terms{display:grid;grid-template-columns:minmax(7em,max-content) 1fr;border-top:1px solid var(--line)}
.terms dt,.terms dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
.terms dt{font-weight:700;padding-right:16px}
.terms dd{font-size:14px;line-height:1.7}
.formula{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.formula .fx{font-family:var(--f-mono);font-size:14px;font-weight:700;overflow-x:auto;white-space:nowrap}
.formula .ex{font-size:13px;color:var(--muted)}
.tip{font-size:13px;border-left:3px solid var(--tc);padding:2px 0 2px 12px}
@media (max-width:520px){.terms{grid-template-columns:1fr}.terms dt{border-bottom:none;padding-bottom:0}.terms dd{padding-top:2px}}
footer{font-size:12px;color:var(--muted);line-height:1.7}
.resetline{display:flex;justify-content:flex-end}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

@media (max-width:520px){
  .summary{grid-template-columns:1fr;justify-items:center}
  .fields{width:100%}
  h1{font-size:22px}
  .frow{grid-template-columns:6.5em 1fr 3.8em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:hover{transform:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===== 問題データ（オリジナル作成。出題範囲はITパスポート試験の3分野に準拠） ===== */
const Q = [
/* ---------- ストラテジ系 ---------- */
{f:"st",t:"財務指標",q:"ROE（自己資本利益率）を求める式として、適切なものはどれか。",c:["当期純利益 ÷ 自己資本","当期純利益 ÷ 総資産","営業利益 ÷ 売上高","自己資本 ÷ 総資本"],e:"ROEは株主が出した資本（自己資本）でどれだけ利益を上げたかを示す指標で、当期純利益÷自己資本で求めます。当期純利益÷総資産はROA、自己資本÷総資本は自己資本比率です。"},
{f:"st",t:"損益分岐点",q:"固定費が400万円、変動費率が60%の製品がある。損益分岐点売上高は何万円か。",c:["1,000万円","667万円","640万円","240万円"],e:"損益分岐点売上高＝固定費÷(1−変動費率)＝400÷(1−0.6)＝400÷0.4＝1,000万円です。"},
{f:"st",t:"経営戦略",q:"SWOT分析において、内部環境の分析に該当する要素の組合せはどれか。",c:["強み と 弱み","機会 と 脅威","強み と 機会","弱み と 脅威"],e:"SWOTのうち、強み(Strengths)・弱み(Weaknesses)は自社の内部環境、機会(Opportunities)・脅威(Threats)は市場や競合などの外部環境です。"},
{f:"st",t:"経営戦略",q:"PPM（プロダクトポートフォリオマネジメント）で、市場成長率が高く、市場占有率も高い事業の分類はどれか。",c:["花形","金のなる木","問題児","負け犬"],e:"成長率高・シェア高は「花形」。成長率低・シェア高は「金のなる木」、成長率高・シェア低は「問題児」、どちらも低いのが「負け犬」です。"},
{f:"st",t:"知的財産権",q:"著作権法で保護の対象となるものはどれか。",c:["プログラムのソースコード","プログラム言語","アルゴリズム","通信プロトコル（規約）"],e:"プログラムそのもの（表現）は著作物として保護されますが、プログラム言語・規約・解法（アルゴリズム）は著作権法の保護対象外と明記されています。"},
{f:"st",t:"知的財産権",q:"日本の特許権の存続期間として、原則的なものはどれか。",c:["出願日から20年","登録日から10年","出願日から10年","著作者の死後70年"],e:"特許権の存続期間は原則として出願日から20年です（医薬品などは延長登録制度あり）。死後70年は著作権の原則的な保護期間です。"},
{f:"st",t:"セキュリティ関連法規",q:"不正アクセス禁止法で処罰の対象となる行為はどれか。",c:["他人のIDとパスワードを無断で使い、ネットワーク経由でシステムにログインする","自分のPCに保存されたファイルを誤って削除する","公開されているWebページを閲覧して内容をメモする","自社のサーバに管理者として正規にログインする"],e:"他人の識別符号（ID・パスワード）を無断で入力してアクセス制御のかかったシステムを利用する行為は「不正アクセス行為」に当たります。"},
{f:"st",t:"個人情報保護",q:"個人情報保護法における「要配慮個人情報」に該当するものはどれか。",c:["病歴","氏名","メールアドレス","勤務先の部署名"],e:"要配慮個人情報は、人種・信条・社会的身分・病歴・犯罪の経歴など、不当な差別や偏見が生じないよう特に配慮が必要な情報です。取得には原則として本人の同意が必要です。"},
{f:"st",t:"労働関連法規",q:"労働者派遣において、派遣労働者に対して業務上の指揮命令を行うのは誰か。",c:["派遣先","派遣元","派遣労働者自身","厚生労働大臣"],e:"雇用関係は派遣元と派遣労働者の間にありますが、業務の指揮命令は派遣先が行います。請負契約では、発注者は請負側の労働者に直接指揮命令できません。"},
{f:"st",t:"企業活動",q:"災害やシステム障害などが発生しても、重要な業務を継続・早期復旧するために事前に策定する計画はどれか。",c:["BCP","BPR","CSR","SLA"],e:"BCP（事業継続計画）の説明です。BPRは業務プロセスの抜本的な再設計、CSRは企業の社会的責任、SLAはサービスレベル合意書です。"},
{f:"st",t:"業務分析",q:"売上高の大きい順に商品を並べ、累積構成比から重点管理する商品を絞り込む手法に用いる図はどれか。",c:["パレート図","散布図","特性要因図","管理図"],e:"パレート図を使ったABC分析の説明です。累積比率が70%程度までをA、90%程度までをBのように分類して重点管理します。"},
{f:"st",t:"システム戦略",q:"原材料の調達から生産・物流・販売までの一連の流れを、企業間で連携して全体最適を図る手法はどれか。",c:["SCM","CRM","ERP","SFA"],e:"SCM（サプライチェーンマネジメント）の説明です。CRMは顧客関係管理、ERPは基幹業務の統合管理、SFAは営業支援です。"},
{f:"st",t:"システム企画",q:"システムの調達で、発注先候補の企業に対して具体的な提案書の提出を依頼するために提示する文書はどれか。",c:["RFP","RFI","NDA","SLA"],e:"RFP（提案依頼書）の説明です。RFI（情報提供依頼書）は、RFPの前段階で技術動向や製品情報などの提供を求める文書です。"},
{f:"st",t:"財務諸表",q:"貸借対照表の構成として、常に成り立つ関係はどれか。",c:["資産 ＝ 負債 ＋ 純資産","資産 ＝ 収益 − 費用","負債 ＝ 資産 ＋ 純資産","純資産 ＝ 収益 ＋ 負債"],e:"貸借対照表は左側（借方）に資産、右側（貸方）に負債と純資産を記載し、左右の合計は必ず一致します。"},
{f:"st",t:"経営管理",q:"最終目標の達成度を測る指標をKGIとしたとき、その達成に向けた中間プロセスの達成度を測る指標はどれか。",c:["KPI","KSF","ROI","CSF"],e:"KPI（重要業績評価指標）はプロセスの進み具合を測る指標です。KGIは最終目標、KSF/CSFは成功のために重要な要因、ROIは投資利益率です。"},
{f:"st",t:"ビジネスインダストリ",q:"インターネット販売で、個々の売上は小さいニッチ商品を多数そろえることで、全体として大きな売上を得る考え方はどれか。",c:["ロングテール","コモディティ化","ブルーオーシャン","オムニチャネル"],e:"販売数量の少ない商品群が恐竜の長い尾のように続くことから「ロングテール」と呼ばれます。在庫・陳列コストの小さいネット販売で成り立ちやすい考え方です。"},

/* ---------- マネジメント系 ---------- */
{f:"ma",t:"プロジェクトマネジメント",q:"プロジェクトの作業を階層的に細かく分解し、管理しやすい単位にまとめた図表はどれか。",c:["WBS","アローダイアグラム","ガントチャート","DFD"],e:"WBS（Work Breakdown Structure）の説明です。分解された最下位の作業単位をワークパッケージと呼びます。"},
{f:"ma",t:"スケジュール管理",q:"作業Aの後に作業BとCを並行して行い、BとCの両方が終わったら作業Dを行う。所要日数がA=3日、B=4日、C=6日、D=2日のとき、プロジェクト全体の最短所要日数は何日か。",c:["11日","9日","13日","15日"],e:"経路A→B→Dは9日、A→C→Dは11日。Dは両方の完了を待つため、長い方の経路（クリティカルパス）A→C→Dの11日が最短所要日数です。"},
{f:"ma",t:"サービスマネジメント",q:"ITサービスの提供者と利用者の間で、サービスの品質や範囲について合意した内容を文書にしたものはどれか。",c:["SLA","SLM","RFP","WBS"],e:"SLA（サービスレベル合意書）の説明です。SLMはSLAで合意した水準を維持・改善するための管理活動を指します。"},
{f:"ma",t:"サービスマネジメント",q:"インシデント管理の主な目的として、適切なものはどれか。",c:["中断したサービスをできるだけ迅速に回復させる","障害の根本原因を突き止めて再発を防止する","システムの構成要素の情報を正確に維持する","変更を安全かつ効率的に実施する"],e:"インシデント管理は「まずサービスを早く元に戻す」ことが目的です。根本原因の究明と再発防止は問題管理、構成要素の管理は構成管理、変更の実施は変更管理の役割です。"},

/* ===== 学習記録（この端末のブラウザ内に保存） ===== */
const KEY="itpass-log-v1";
let log={};
try{log=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){log={}}
function saveLog(){try{localStorage.setItem(KEY,JSON.stringify(log))}catch(e){}}
function record(id,ok){const r=log[id]||{n:0,k:0,last:null};r.n++;if(ok)r.k++;r.last=ok?1:0;log[id]=r;saveLog()}

function stats(f){
  const qs=Q.filter(q=>!f||q.f===f);
  let tried=0,n=0,k=0;
  qs.forEach(q=>{const r=log[q.id];if(r){tried++;n+=r.n;k+=r.k}});
  return {total:qs.length,tried,rate:n?k/n:null};
}
const wrongIds=()=>Q.filter(q=>log[q.id]&&log[q.id].last===0).map(q=>q.id);

/* ===== 状態 ===== */
let S={view:"home"};
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let timerId=null;

function start(mode,f){
  let pool;
  if(mode==="field") pool=shuffle(Q.filter(q=>q.f===f));
  else if(mode==="mock") pool=shuffle(Q).slice(0,20);
  else if(mode==="review") pool=shuffle(Q.filter(q=>wrongIds().includes(q.id)));
  else pool=shuffle(Q).slice(0,10);
  if(!pool.length) return;
  S={view:"quiz",mode,f,items:pool.map(q=>({id:q.id,order:shuffle([0,1,2,3]),pick:null})),i:0,t0:Date.now()};
  clearInterval(timerId);
  if(mode==="mock") timerId=setInterval(tick,1000);
  render();
}
function tick(){const el=document.getElementById("timer");if(el)el.textContent=fmt(Date.now()-S.t0)}
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

function answer(pos){
  const it=S.items[S.i]; if(it.pick!==null) return;
  it.pick=it.order[pos];
  record(it.id,it.pick===0);
  render();
}
function next(){
  if(S.i<S.items.length-1){S.i++;render();window.scrollTo({top:0})}
  else{clearInterval(timerId);S.view="result";S.t1=Date.now();render();window.scrollTo({top:0})}
}

/* ===== 描画 ===== */
function gauge(rate){
  const r=46,c=2*Math.PI*r,p=rate==null?0:rate;
  return `<svg class="gauge" viewBox="0 0 108 108" role="img" aria-label="総合正答率">
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c*p} ${c}" transform="rotate(-90 54 54)"/>
    <text x="54" y="54" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="22" font-weight="700" fill="var(--ink)">${rate==null?"—":Math.round(p*100)}</text>
    <text x="54" y="72" text-anchor="middle" font-size="10" fill="var(--muted)">${rate==null?"未回答":"% 正答"}</text>
  </svg>`;
}
function fieldRows(){
  return Object.keys(FIELDS).map(k=>{const s=stats(k);const w=s.rate==null?0:s.rate*100;
    return `<div class="frow"><span>${FIELDS[k].name}</span>
      <div class="bar"><i style="width:${w}%;background:${FIELDS[k].color}"></i><span class="pass" title="目安60%"></span></div>
      <span class="v mono">${s.rate==null?"—":Math.round(w)+"%"}</span></div>`}).join("");
}

    <div class="fields">${fieldRows()}

  </section>

  <footer>

function quiz(){
  const it=S.items[S.i],q=Q[it.id],done=it.pick!==null,ok=it.pick===0;
  const title=S.mode==="field"?FIELDS[S.f].name:S.mode==="mock"?"ミニ模試":S.mode==="review"?"復習":"ランダム10問";
  return `
  <header class="top"><div><div class="label">${esc(title)}</div><h1 class="mono" style="font-family:var(--f-mono)">問${S.i+1}<span class="muted" style="font-size:16px"> / ${S.items.length}</span></h1></div>
    <div style="display:flex;gap:12px;align-items:center">${S.mode==="mock"?`<span class="timer mono">⏱ <span id="timer">${fmt(Date.now()-S.t0)}</span></span>`:""}
    <button class="btn ghost" data-act="quit">中断</button></div></header>
  <div class="progress"><i style="width:${(S.i+(done?1:0))/S.items.length*100}%"></i></div>
  <article class="panel">
    <div class="qhead"><span class="tag ${q.f}" style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px">${FIELDS[q.f].short}</span><span class="note">${esc(q.t)}</span></div>
    <p class="qtext" style="margin-top:12px">${esc(q.q)}</p>
    <div class="choices" role="group" aria-label="選択肢">
      ${it.order.map((ci,pos)=>{let cls="";if(done){if(ci===0)cls="ok";else if(ci===it.pick)cls="ng"}
        return `<button class="choice ${cls}" data-act="ans" data-pos="${pos}" ${done?"disabled":""}><span class="k">${KANA[pos]}</span><span>${esc(q.c[ci])}</span></button>`}).join("")}
    </div>
    ${done?`<div class="explain"><div class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解"}　<span class="muted" style="font-size:14px;font-weight:700">正答：${KANA[it.order.indexOf(0)]}</span></div><p>${esc(q.e)}</p></div>
    <div class="actions"><span></span><button class="btn primary" data-act="next" id="nextbtn">${S.i<S.items.length-1?"次の問題へ →":"結果を見る"}</button></div>`:""}
  </article>
  <p class="note">キーボード：1〜4 で選択、Enter で次へ</p>`;
}

function result(){
  const n=S.items.length,k=S.items.filter(i=>i.pick===0).length;
  const by={};S.items.forEach(i=>{const f=Q[i.id].f;by[f]=by[f]||{n:0,k:0};by[f].n++;if(i.pick===0)by[f].k++});
  const wrong=S.items.filter(i=>i.pick!==0);
  const time=S.mode==="mock"?`<div class="note mono">所要時間 ${fmt(S.t1-S.t0)}（1問あたり ${Math.round((S.t1-S.t0)/1000/n)}秒 / 目安72秒）</div>`:"";
  return `
  <header class="top"><div><div class="label">結果</div><h1>おつかれさまでした</h1></div></header>
  <section class="panel" style="display:flex;flex-direction:column;gap:14px">
    <div class="score"><span class="big">${k}</span><span class="mono muted" style="font-size:20px">/ ${n}</span><span style="margin-left:8px;font-weight:700">正答率 ${Math.round(k/n*100)}%</span></div>
    ${time}
    <div class="fields">${Object.keys(by).map(f=>{const w=by[f].k/by[f].n*100;return `<div class="frow"><span>${FIELDS[f].name}</span><div class="bar"><i style="width:${w}%;background:${FIELDS[f].color}"></i><span class="pass"></span></div><span class="v mono">${by[f].k}/${by[f].n}</span></div>`}).join("")}</div>
  </section>
  ${wrong.length?`<section class="panel"><h2>間違えた問題</h2><div class="wrong-list">${wrong.map(i=>{const q=Q[i.id];return `<div class="w"><b>${esc(q.q)}</b><span class="muted">正答：</span>${esc(q.c[0])}</div>`}).join("")}</div></section>`:`<section class="panel"><h2>全問正解</h2><p style="margin:8px 0 0">このセットはすべて正解でした。</p></section>`}
  <div class="actions"><button class="btn ghost" data-act="home">ホームへ戻る</button>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${wrong.length?`<button class="btn" data-act="review">間違えた問題を復習</button>`:""}<button class="btn primary" data-act="again">もう一度</button></div></div>`;
}

function notes(){
  const f=S.f,list=NOTES[f],s=stats(f);
  return `
  <header class="top"><div><div class="label">要点まとめ</div><h1>${FIELDS[f].name}</h1></div>
    <button class="btn ghost" data-act="home">ホームへ</button></header>
  <div class="tabs" role="tablist">${Object.keys(FIELDS).map(k=>`<button class="tab" role="tab" aria-selected="${k===f}" style="--tc:${FIELDS[k].color}" data-act="notes" data-f="${k}">${FIELDS[k].short}</button>`).join("")}</div>
  <nav class="toc" aria-label="目次">${list.map((n,i)=>`<a href="#n${i}" data-act="jump" data-i="${i}">${esc(n.s)}</a>`).join("")}</nav>
  ${list.map((n,i)=>`
  <section class="panel nsec" id="n${i}" style="--tc:${FIELDS[f].color}">
    <h3><span class="no">${String(i+1).padStart(2,"0")}</span>${esc(n.s)}</h3>
    ${n.l?`<p class="lead">${esc(n.l)}</p>`:""}
    ${n.fx?n.fx.map(x=>`<div class="formula"><div class="fx">${esc(x[0])}</div>${x[1]?`<div class="ex">${esc(x[1])}</div>`:""}</div>`).join(""):""}
    ${n.d?`<dl class="terms">${n.d.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>`:""}
    ${n.tip?`<div class="tip"><b>ポイント</b>　${esc(n.tip)}</div>`:""}
  </section>`).join("")}
  <div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div><strong>読んだら解いて確認</strong><div class="note">${FIELDS[f].name} ${s.total}問 · 回答済 ${s.tried}問</div></div>
    <button class="btn primary" data-act="field" data-f="${f}">この分野の問題を解く →</button>
  </div>`;
}

function render(){
  app.innerHTML=S.view==="home"?home():S.view==="quiz"?quiz():S.view==="notes"?notes():result();
  const nb=document.getElementById("nextbtn");if(nb)nb.focus({preventScroll:true});
}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="quick")start("quick");
  else if(a==="mock")start("mock");
  else if(a==="review")start("review");
  else if(a==="field")start("field",b.dataset.f);
  else if(a==="notes"){S={view:"notes",f:b.dataset.f};render();window.scrollTo({top:0})}
  else if(a==="jump"){e.preventDefault();document.getElementById("n"+b.dataset.i)?.scrollIntoView({behavior:"smooth"})}
  else if(a==="ans")answer(+b.dataset.pos);
  else if(a==="next")next();
  else if(a==="quit"||a==="home"){clearInterval(timerId);S={view:"home"};render()}
  else if(a==="again")start(S.mode,S.f);
  else if(a==="askreset"){S.confirmReset=true;render()}
  else if(a==="cancelreset"){S.confirmReset=false;render()}
  else if(a==="doreset"){log={};saveLog();S={view:"home"};render()}
});
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz")return;
  const it=S.items[S.i];
  if(it.pick===null&&["1","2","3","4"].includes(e.key))answer(+e.key-1);
  else if(it.pick!==null&&e.key==="Enter"&&document.activeElement?.id!=="nextbtn"){e.preventDefault();next()}
});
render();
</script>
</body>
</html>
